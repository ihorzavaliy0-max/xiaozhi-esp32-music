name: Build Xiaozhi Music Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: 'v5.2.2'
          target: 'esp32s3'
          command: |
            idf.py set-target esp32s3
            idf.py -D BOARD_TYPE=freenove-esp32s3-display-2.8-lcd build
            cd build
            esptool.py --chip esp32s3 merge_bin -o merged-binary.bin @flash_args

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-music-firmware
          path: build/merged-binary.bin
