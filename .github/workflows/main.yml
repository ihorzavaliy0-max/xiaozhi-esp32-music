name: Build Xiaozhi Music Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py -D BOARD_TYPE=bread-compact-wifi-lcd build
          idf.py merge-bin -o merged-binary.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-music-firmware
          path: build/merged-binary.bin
